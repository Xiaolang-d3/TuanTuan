name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Optional immutable commit SHA; overrides must match the event's release tag."
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate-ref:
    name: validate-ref
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Restrict explicit SHA overrides to their release context
        env:
          REQUESTED_REF: ${{ inputs.ref }}
          RELEASE_TAG: ${{ github.event.inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess

          requested = os.environ["REQUESTED_REF"]
          if not requested:
              raise SystemExit(0)
          if not re.fullmatch(r"[0-9a-f]{40}", requested):
              raise SystemExit("CI ref must be a full immutable commit SHA")
          if requested == os.environ["EVENT_SHA"]:
              raise SystemExit(0)
          tag = os.environ["RELEASE_TAG"]
          number = r"(?:0|[1-9][0-9]*)"
          identifier = rf"(?:{number}|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)"
          version = rf"v{number}\.{number}\.{number}(?:-{identifier}(?:\.{identifier})*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?"
          if os.environ["EVENT_NAME"] != "workflow_dispatch" or not re.fullmatch(version, tag):
              raise SystemExit("A different CI SHA is only allowed for an existing manual release tag")
          url = f"https://github.com/{os.environ['REPOSITORY']}.git"
          refs = [f"refs/tags/{tag}", f"refs/tags/{tag}^{{}}"]
          result = subprocess.run(["git", "ls-remote", "--exit-code", url, *refs], check=True, capture_output=True, text=True, timeout=60)
          remote = dict(line.split()[::-1] for line in result.stdout.splitlines())
          if remote.get(refs[1], remote.get(refs[0])) != requested:
              raise SystemExit("CI SHA does not match the release tag")
          PY

  docs-sync:
    needs: validate-ref
    name: docs-sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false
          fetch-depth: 0
      - name: Ensure local docs are not tracked
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/check-docs-sync.sh "$BASE_SHA" "$HEAD_SHA"

  backend-tests:
    needs: validate-ref
    name: backend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev-lock.txt
      - name: Install backend dependencies
        working-directory: backend
        run: |
          # Runtime + test lock, every package hash-verified.
          python -m pip install --require-hashes --no-deps --only-binary :all: -r requirements-dev-lock.txt
      - name: Scan for executable .pth files
        # -I -S: no site processing, so no .pth runs before it is scanned.
        run: python -I -S backend/scripts/scan_pth.py --python python
      - name: Run backend tests
        working-directory: backend
        env:
          EMBEDDING_BACKEND: hash
        run: python -m pytest tests -q --junitxml=pytest-report.xml
      - name: Summarize failing backend tests
        if: failure()
        working-directory: backend
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          try:
              root = ET.parse("pytest-report.xml").getroot()
          except OSError:
              print("::error::pytest-report.xml was not produced")
              raise SystemExit(0)

          for case in root.iter("testcase"):
              problem = case.find("failure") if case.find("failure") is not None else case.find("error")
              if problem is None:
                  continue
              message = (problem.get("message") or problem.text or "").strip().splitlines()
              first = message[0][:300] if message else "no message"
              where = case.get("file") or "tests"
              name = f"{case.get('classname', '')}::{case.get('name', '')}"
              print(f"::error file={where}::{name} - {first}")
          PY
      - name: Upload backend test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-pytest-report
          path: backend/pytest-report.xml
          if-no-files-found: ignore

  backend-windows-documents:
    needs: validate-ref
    name: backend-windows-documents
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev-lock.txt
      - name: Install locked backend dependencies
        working-directory: backend
        run: |
          python -m pip install --require-hashes --no-deps --only-binary :all: -r requirements-dev-lock.txt
      - name: Scan for executable .pth files
        run: python -I -S backend/scripts/scan_pth.py --python python
      - name: Test native Windows locale and ACL
        working-directory: backend
        env:
          EMBEDDING_BACKEND: hash
          PYTHONUTF8: "0"
        run: python -m pytest tests/test_library_sources.py tests/test_chat_artifacts.py tests/test_file_permissions_windows.py tests/test_document_blocks.py tests/test_source_versions.py tests/test_source_backfill.py tests/test_library_citations.py -q --junitxml=platform-default.xml
      - name: Compare UTF-8 mode
        working-directory: backend
        env:
          EMBEDDING_BACKEND: hash
        run: python -X utf8 -m pytest tests/test_library_sources.py tests/test_chat_artifacts.py tests/test_file_permissions_windows.py -q --junitxml=platform-utf8.xml
      - name: Upload Windows document reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-windows-document-reports
          path: backend/platform-*.xml
          if-no-files-found: ignore

  frontend-unit:
    needs: validate-ref
    name: frontend-unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend unit tests
        working-directory: frontend
        run: npm run test
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  frontend-e2e:
    name: frontend-e2e
    strategy:
      # Both legs carry signal; a failed Linux leg must not mask the macOS result.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: frontend-unit
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements-lock.txt
      - name: Install integration backend
        run: |
          # Runtime lock only, as deployed.
          python -m pip install --require-hashes --no-deps --only-binary :all: -r backend/requirements-lock.txt
      - name: Scan for executable .pth files
        # -I -S: no site processing, so no .pth runs before it is scanned.
        run: python -I -S backend/scripts/scan_pth.py --python python
      - name: Restore frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run frontend end-to-end tests
        working-directory: frontend
        env:
          CI: true
          E2E_PYTHON: python
        # The github reporter turns each failed spec into a check annotation,
        # so a red run explains itself without downloading logs.
        run: npm run test:e2e -- --reporter=github,line
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ runner.os }}
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore
      - name: Upload responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-screenshots-${{ runner.os }}
          path: ${{ runner.workspace }}/output/playwright/*.png
          if-no-files-found: ignore

  ci-gate:
    name: ci-gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - validate-ref
      - docs-sync
      - backend-tests
      - backend-windows-documents
      - frontend-unit
      - frontend-e2e
    steps:
      - name: Require all CI jobs
        run: |
          set -euo pipefail
          test "${{ needs.validate-ref.result }}" = success
          test "${{ needs.backend-tests.result }}" = success
          test "${{ needs.backend-windows-documents.result }}" = success
          test "${{ needs.frontend-unit.result }}" = success
          test "${{ needs.frontend-e2e.result }}" = success
          case "${{ needs.docs-sync.result }}" in
            success|skipped) ;;
            *) echo "docs-sync=${{ needs.docs-sync.result }}"; exit 1 ;;
          esac
