name: QQ Notify

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  notify:
    if: github.repository == 'Xiaolang-d3/TuanTuan'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send merge notice to QQ group
        env:
          QQ_APP_ID: ${{ secrets.QQ_BOT_APP_ID }}
          QQ_APP_SECRET: ${{ secrets.QQ_BOT_APP_SECRET }}
          QQ_GROUP_OPENID: ${{ secrets.QQ_GROUP_OPENID }}
        run: |
          if [ -z "$QQ_APP_ID" ] || [ -z "$QQ_APP_SECRET" ] || [ -z "$QQ_GROUP_OPENID" ]; then
            echo "::warning::QQ secrets not configured; skipping notice."
            exit 0
          fi
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          import re
          from datetime import datetime, timedelta, timezone

          event = json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8"))
          repo = os.environ["GITHUB_REPOSITORY"]
          head = event.get("head_commit") or {}
          commits = event.get("commits") or ([head] if head else [])
          pusher = (event.get("pusher") or {}).get("name") or os.environ.get("GITHUB_ACTOR", "")

          def describe(commit):
              title = (commit.get("message") or "").splitlines()[0].strip()
              match = re.search(r"\s*\(#(\d+)\)$", title)
              return title[: match.start()] if match else title, match.group(1) if match else None

          def local_time(stamp):
              try:
                  moment = datetime.fromisoformat(stamp.replace("Z", "+00:00"))
                  return moment.astimezone(timezone(timedelta(hours=8))).strftime("%m-%d %H:%M")
              except (AttributeError, ValueError):
                  return ""

          items = [describe(commit) for commit in commits]
          author = (head.get("author") or {}).get("name") or pusher
          lines = ["【团团】main 已更新"]
          if len(items) == 1:
              lines.append(f"内容：{items[0][0][:60]}")
          else:
              lines.append(f"内容：共 {len(items)} 项")
              for index, (title, _) in enumerate(items[-5:], 1):
                  lines.append(f"  {index}. {title[:50]}")
          lines.append(f"作者：{author}")
          when = local_time(head.get("timestamp"))
          if when:
              lines.append(f"时间：{when}")
          number = items[-1][1] if len(items) == 1 else None
          if number:
              link = f"https://github.com/{repo}/pull/{number}"
          elif len(items) > 1:
              link = event.get("compare")
          else:
              link = head.get("url")
          if link:
              lines.append(f"链接：{link}")
          content = "\n".join(lines)

          def post(url, body, headers=None):
              request = urllib.request.Request(
                  url,
                  data=json.dumps(body).encode(),
                  headers={"Content-Type": "application/json", **(headers or {})},
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=15) as response:
                  return json.loads(response.read() or b"{}")

          try:
              token = post(
                  "https://bots.qq.com/app/getAppAccessToken",
                  {"appId": os.environ["QQ_APP_ID"], "clientSecret": os.environ["QQ_APP_SECRET"]},
              )["access_token"]
              result = post(
                  f"https://api.sgroup.qq.com/v2/groups/{os.environ['QQ_GROUP_OPENID']}/messages",
                  {"msg_type": 0, "content": content},
                  {"Authorization": f"QQBot {token}"},
              )
              print("sent", result.get("id", ""))
          except urllib.error.HTTPError as error:
              # A failed notice must not mark the push as broken; surface it as a warning.
              print(f"::warning::QQ notice failed: HTTP {error.code} {error.read().decode()[:300]}")
          except Exception as error:
              print(f"::warning::QQ notice failed: {error}")
          PY
