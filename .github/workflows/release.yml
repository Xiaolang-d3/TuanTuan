name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的版本标签，例如 v2.0.0。留空则仅构建制品。"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      sha: ${{ steps.metadata.outputs.sha }}
      tag_sha: ${{ steps.metadata.outputs.tag_sha }}
      publish: ${{ steps.metadata.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Validate version and resolve the exact tag to a commit
        id: metadata
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          REQUESTED_TAG: ${{ inputs.tag }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
        run: python scripts/release_metadata.py
      - name: Retain trusted metadata checker for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: release-metadata-checker
          path: scripts/release_metadata.py
          if-no-files-found: error

  verify:
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  publish:
    name: publish-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [resolve, verify]
    if: needs.resolve.outputs.publish == 'true'
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
      RELEASE_TAG_SHA: ${{ needs.resolve.outputs.tag_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Restore trusted metadata checker
        uses: actions/download-artifact@v4
        with:
          name: release-metadata-checker
          path: ${{ runner.temp }}/release-checker
      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Package frontend dist
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -C frontend -czf "dist/tuantuan-frontend-${RELEASE_TAG}.tar.gz" dist
      - name: Recheck remote tag immediately before publishing
        env:
          RELEASE_CHECK: "true"
        run: python "$RUNNER_TEMP/release-checker/release_metadata.py"
      - name: Create a new release without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Creating first fails closed for every existing release (including a
          # draft left by an interrupted run). Never upload to an old release.
          gh release create "$RELEASE_TAG" --draft --verify-tag \
            --title "$RELEASE_TAG" --generate-notes
          gh release upload "$RELEASE_TAG" "dist/tuantuan-frontend-${RELEASE_TAG}.tar.gz"
          gh release edit "$RELEASE_TAG" --draft=false
